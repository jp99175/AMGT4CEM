<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>AMGT4CEM &ndash; Éditeur d'étiquettes de planches (plugin)</title>
</head>
<body>
<p style="font-family: sans-serif; padding: 2em;">Chargement de la carte…</p>
<script>
/**
 * Page de lancement du plugin "pe-label-editor" — AUCUN fichier de
 * l'application (index.html, src/*.js, style.css...) n'est modifié : cette
 * page se contente de récupérer le vrai index.html de l'appli tel quel, d'y
 * injecter le CSS/JS du plugin juste avant </body> (donc après TOUS les
 * scripts de l'appli, une fois toutes les variables globales AMGT4CEM_*
 * prêtes), puis de réécrire le document avec document.write — exactement
 * comme si on avait ouvert l'index.html d'origine, avec juste ce script en
 * plus à la fin.
 *
 * Tous les fichiers de ce plugin (celui-ci compris) vivent uniquement dans
 * ce dossier (plugins/pe-label-editor/) : pour le désinstaller, supprimer
 * le dossier suffit, rien d'autre dans le dépôt n'y fait référence.
 *
 * Nécessite d'être servi en http(s) (comme l'appli elle-même) : le fetch()
 * ci-dessous échoue en ouverture directe file://.
 */
(async function () {
  try {
    const res = await fetch('../../index.html');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let html = await res.text();

    // Cette page vit deux niveaux sous la racine de l'appli
    // (plugins/pe-label-editor/) : un <base> fait pointer tous les chemins
    // relatifs de l'index.html d'origine (./style.css, ./src/...) vers la
    // racine, sans toucher à un seul de ces chemins.
    html = html.replace('<head>', '<head>\n<base href="../../">');

    // Nos propres fichiers sont référencés relativement à cette même racine
    // (cohérent avec le <base> ci-dessus), pas relativement à ce dossier.
    const injected =
      '<link rel="stylesheet" href="plugins/pe-label-editor/pe-label-editor.css">\n' +
      '<script src="plugins/pe-label-editor/pe-label-editor.js"><' + '/script>\n</body>';
    html = html.replace('</body>', injected);

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML =
      '<p style="font-family: sans-serif; padding: 2em; color: #b00;">' +
      "Impossible de charger l'application (" + (err && err.message) + ').<br>' +
      'Ce plugin doit être servi en http(s) (comme le reste du site), pas ouvert directement en double-clic (file://).' +
      '</p>';
  }
})();
</script>
</body>
</html>
