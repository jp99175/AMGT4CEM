<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>AMGT4CEM</title>

<link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- Point d'entrée UNIQUE de l'application. Sans paramètre : nouvelle interface (carte). ?page=carto|signal|reglages choisit la page ;
       l'ancienne interface reste atteignable par ?app=carto|signal|admin (repli, à retirer).
     Le routeur (src/router.js) copie ici le gabarit de l'interface choisie, puis charge ses
     scripts (liste `apps` de config.js). Les deux interfaces partagent config.js et les
     modules du socle commun ; elles ne se chargent jamais l'une l'autre. -->

<!-- ========== Interface « carto » : AMGT4CEM (carte) ========== -->
<template id="amgt-tpl-carto">

  <div id="map"></div>

  <!-- Barre d'outils principale -->
  <div id="amgt-toolbar">
    <button id="amgt-menu-btn" class="amgt-btn" title="Fond de plan, couches, vue">
      ☰ Carte
    </button>
    <!-- Visible seulement pour un utilisateur connecté (src/accountButton.js). -->
    <button id="amgt-add-point-btn" class="amgt-btn amgt-hidden" title="Ajouter un point">
      ✚ Ajouter un point
    </button>
  </div>

  <!-- Menu : fond de plan, couches visibles, réinitialisation de la vue -->
  <div id="amgt-map-menu" class="amgt-panel amgt-hidden">
    <h3>Fond de plan</h3>
    <button id="amgt-settings-btn" class="amgt-map-menu__settings-btn amgt-hidden" title="Paramètres des sources de données">
      ⚙
    </button>
    <label class="amgt-radio-row">
      <input type="radio" name="amgt-basemap" value="urbis" checked /> UrbIS
    </label>
    <div class="amgt-layer-row">
      <label class="amgt-radio-row">
        <input type="radio" name="amgt-basemap" value="bruciel" /> Orthophotos
      </label>
      <!-- Réglages des orthophotos : années et sources proposées, résolution (src/orthoPicker.js). -->
      <button type="button" id="amgt-ortho-settings-btn" class="amgt-opacity-toggle-btn" title="Réglages des orthophotos : années, sources, résolution">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <line x1="1" y1="3" x2="15" y2="3" />
          <circle cx="5" cy="3" r="1.6" />
          <line x1="1" y1="8" x2="15" y2="8" />
          <circle cx="11" cy="8" r="1.6" />
          <line x1="1" y1="13" x2="15" y2="13" />
          <circle cx="7" cy="13" r="1.6" />
        </svg>
      </button>
    </div>

    <h3>Couches</h3>

    <div class="amgt-layer-row">
      <label class="amgt-checkbox-row">
        <input type="checkbox" id="amgt-layer-metro" checked /> Métro
      </label>
      <button type="button" class="amgt-opacity-toggle-btn" data-layer="metro" title="Régler l'opacité">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <line x1="1" y1="3" x2="15" y2="3" />
          <circle cx="5" cy="3" r="1.6" />
          <line x1="1" y1="8" x2="15" y2="8" />
          <circle cx="11" cy="8" r="1.6" />
          <line x1="1" y1="13" x2="15" y2="13" />
          <circle cx="7" cy="13" r="1.6" />
        </svg>
      </button>
    </div>
    <div class="amgt-opacity-slider-row amgt-hidden" data-layer="metro">
      <input type="range" min="0" max="100" value="100" class="amgt-opacity-slider" />
    </div>

    <div class="amgt-layer-row">
      <label class="amgt-checkbox-row">
        <input type="checkbox" id="amgt-layer-urbistopo" checked /> UrbIS Topo
      </label>
      <button type="button" class="amgt-opacity-toggle-btn" data-layer="urbistopo" title="Régler l'opacité">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <line x1="1" y1="3" x2="15" y2="3" />
          <circle cx="5" cy="3" r="1.6" />
          <line x1="1" y1="8" x2="15" y2="8" />
          <circle cx="11" cy="8" r="1.6" />
          <line x1="1" y1="13" x2="15" y2="13" />
          <circle cx="7" cy="13" r="1.6" />
        </svg>
      </button>
    </div>
    <div class="amgt-opacity-slider-row amgt-hidden" data-layer="urbistopo">
      <input type="range" min="0" max="100" value="100" class="amgt-opacity-slider" />
      <p class="amgt-topo-edit-hint">
        <a href="#" id="amgt-topo-edit-link">(modifier la sélection)</a>
      </p>
    </div>

    <div class="amgt-layer-row">
      <label class="amgt-checkbox-row">
        <input type="checkbox" id="amgt-layer-patrimoine" checked /> Plans patrimoine
      </label>
      <button type="button" class="amgt-opacity-toggle-btn" data-layer="patrimoine" title="Régler l'opacité">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <line x1="1" y1="3" x2="15" y2="3" />
          <circle cx="5" cy="3" r="1.6" />
          <line x1="1" y1="8" x2="15" y2="8" />
          <circle cx="11" cy="8" r="1.6" />
          <line x1="1" y1="13" x2="15" y2="13" />
          <circle cx="7" cy="13" r="1.6" />
        </svg>
      </button>
    </div>
    <div class="amgt-opacity-slider-row amgt-hidden" data-layer="patrimoine">
      <input type="range" min="0" max="100" value="100" class="amgt-opacity-slider" />
      <p class="amgt-topo-edit-hint">
        <a href="#" id="amgt-patrimoine-edit-link">(modifier la sélection)</a>
      </p>
    </div>

    <!-- Géotechnique : nappe phréatique (src/nappeLayer.js) : décochée au départ, rien n'est requêté tant qu'elle ne l'est pas. -->
    <div class="amgt-layer-row">
      <label class="amgt-checkbox-row">
        <input type="checkbox" id="amgt-layer-nappe" /> Géotechnique
      </label>
      <button type="button" class="amgt-opacity-toggle-btn" data-layer="nappe" title="Régler l'opacité">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <line x1="1" y1="3" x2="15" y2="3" />
          <circle cx="5" cy="3" r="1.6" />
          <line x1="1" y1="8" x2="15" y2="8" />
          <circle cx="11" cy="8" r="1.6" />
          <line x1="1" y1="13" x2="15" y2="13" />
          <circle cx="7" cy="13" r="1.6" />
        </svg>
      </button>
    </div>
    <div class="amgt-opacity-slider-row amgt-hidden" data-layer="nappe">
      <p class="amgt-topo-edit-hint" id="amgt-nappe-status"></p>
      <input type="range" min="0" max="100" value="100" class="amgt-opacity-slider" />
      <p class="amgt-topo-edit-hint">
        <a href="#" id="amgt-nappe-edit-link">(modifier la sélection)</a>
      </p>
    </div>

    <h3 id="amgt-points-heading">Points métier</h3>

    <div class="amgt-layer-row">
      <label class="amgt-checkbox-row">
        <input type="checkbox" id="amgt-layer-points" checked /> Signalements et demandes
      </label>
      <button type="button" class="amgt-opacity-toggle-btn" data-layer="points" title="Régler l'opacité">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <line x1="1" y1="3" x2="15" y2="3" />
          <circle cx="5" cy="3" r="1.6" />
          <line x1="1" y1="8" x2="15" y2="8" />
          <circle cx="11" cy="8" r="1.6" />
          <line x1="1" y1="13" x2="15" y2="13" />
          <circle cx="7" cy="13" r="1.6" />
        </svg>
      </button>
    </div>
    <p class="amgt-topo-edit-hint" id="amgt-signalements-status"></p>
    <div class="amgt-opacity-slider-row amgt-hidden" data-layer="points">
      <input type="range" min="0" max="100" value="100" class="amgt-opacity-slider" />
      <p class="amgt-topo-edit-hint">
        <a href="#" id="amgt-signalements-edit-link">(modifier la sélection)</a>
      </p>
    </div>

    <div id="amgt-menu-prefs-code" class="amgt-menu-prefs amgt-hidden"></div>

    <div class="amgt-map-menu__footer">
      <button id="amgt-reset-view-btn" class="amgt-link-btn" title="Revenir à l'emprise générale du réseau">
        <svg class="amgt-footer-ic" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.6-5.9" />
          <path d="M20 3.5v4.5h-4.5" />
        </svg>Réinitialiser la vue
      </button>
      <!-- Affichage actuel -> affichage par défaut (src/menuPrefs.js) : non connectés (code administrateur) ou, pour un administrateur connecté, tous les utilisateurs connectés. -->
      <button id="amgt-menu-prefs-save" class="amgt-link-btn" type="button" title="Enregistrer l'affichage actuel comme affichage par défaut" aria-label="Enregistrer l'affichage actuel comme affichage par défaut">
        <svg class="amgt-footer-ic" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h11.5L21 7.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
          <path d="M7 3v5h8V3" />
          <path d="M7 21v-8h10v8" />
        </svg>
      </button>
      <!-- Connexion (src/accountButton.js) : icône vierge si personne n'est connecté ; badge vert « validé »
           si un compte est connecté, qui devient une croix rouge au survol (un clic déconnecte). -->
      <button id="amgt-account-btn" class="amgt-btn amgt-btn--icon" type="button" title="Se connecter" aria-label="Se connecter">
        <svg class="amgt-account__user" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
        </svg>
        <span class="amgt-account__badge" aria-hidden="true">
          <svg class="amgt-account__ok" viewBox="0 0 16 16" width="16" height="16">
            <circle cx="8" cy="8" r="7" />
            <path d="M4.5 8.3l2.4 2.4 4.6-4.9" />
          </svg>
          <svg class="amgt-account__out" viewBox="0 0 16 16" width="16" height="16">
            <circle cx="8" cy="8" r="7" />
            <path d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6" />
          </svg>
        </span>
      </button>
    </div>
  </div>

  <!-- Fenêtre de paramètres (⚙), à onglets. Exclusive avec le menu ☰ Carte.
       Réservée aux administrateurs (mot de passe à venir, voir src/admin.js).
       Ce sont des paramètres GÉNÉRAUX : enregistrés sur le serveur, communs à
       tous les visiteurs — pas des réglages de l'appareil.
       1. Sources : adresses des services externes (UrbIS, orthophotos,
          géocodeur), à corriger si l'un d'eux change d'adresse.
       2. Serveur : communication avec le serveur d'enregistrement (relais).
       3. Données : modifications des données (nouveau shapefile,
          mode édition des étiquettes de planche). -->
  <div id="amgt-settings-panel" class="amgt-hidden">
    <div class="amgt-tabs" role="tablist">
      <button type="button" class="amgt-tab amgt-tab--active" role="tab" data-tab="sources">Sources</button>
      <button type="button" class="amgt-tab" role="tab" data-tab="server">Serveur</button>
      <button type="button" class="amgt-tab" role="tab" data-tab="basemaps">Données</button>
    </div>

    <section class="amgt-tab-pane" data-pane="sources">
      <h3>Sources de données</h3>
      <p class="amgt-settings-hint">
        Paramètres généraux, enregistrés sur le serveur et communs à tous les
        visiteurs. À corriger uniquement si l'un de ces services externes change
        d'adresse.
      </p>

      <label class="amgt-settings-row">
        Fond UrbIS &mdash; URL du service WMS
        <input type="text" id="amgt-settings-urbis-url" />
      </label>
      <label class="amgt-settings-row">
        Fond UrbIS &mdash; nom de la couche
        <input type="text" id="amgt-settings-urbis-layers" />
      </label>
      <label class="amgt-settings-row">
        Orthophotos historiques (1935&ndash;1996) &mdash; URL du service WMS
        <input type="text" id="amgt-settings-bruciel-hist-url" />
      </label>
      <label class="amgt-settings-row">
        Orthophotos récentes (2004&ndash;2022) &mdash; URL du service WMS
        <input type="text" id="amgt-settings-bruciel-recent-url" />
      </label>
      <label class="amgt-settings-row">
        Orthophotos Flandre (2000&ndash;2025) &mdash; URL du service WMS
        <input type="text" id="amgt-settings-flandre-url" />
      </label>
      <label class="amgt-settings-row">
        Recherche d'adresses &mdash; URL du géocodeur
        <input type="text" id="amgt-settings-geocoder-url" />
      </label>

      <p id="amgt-settings-sources-status" class="amgt-settings-status" hidden></p>

      <div class="amgt-form-actions">
        <button id="amgt-settings-save" class="amgt-btn amgt-btn--primary">Enregistrer</button>
      </div>
    </section>

    <section class="amgt-tab-pane amgt-hidden" data-pane="server">
      <h3>Communication avec le serveur</h3>
      <p class="amgt-settings-hint">
        Paramètres généraux, enregistrés sur le serveur et communs à tous les
        visiteurs. Le serveur d'enregistrement (relais) écrit dans le dépôt les
        modifications faites dans l'application. Enregistrer ici envoie aussi
        les adresses de l'onglet Sources.
      </p>

      <label class="amgt-settings-row">
        Adresse du relais d'enregistrement
        <input type="text" id="amgt-settings-relay-url" placeholder="https://…workers.dev" autocomplete="off" />
      </label>
      <label class="amgt-settings-row">
        Code administrateur
        <input type="password" id="amgt-settings-admin-code" autocomplete="off" />
      </label>
      <p class="amgt-settings-hint">
        Le code administrateur n'est jamais enregistré : il n'est gardé que le
        temps de cet onglet du navigateur, pour s'identifier auprès du relais.
      </p>
      <p id="amgt-settings-relay-status" class="amgt-settings-status" hidden></p>

      <div class="amgt-form-actions">
        <button id="amgt-settings-relay-test" class="amgt-btn">Tester</button>
        <button id="amgt-settings-relay-save" class="amgt-btn amgt-btn--primary">Enregistrer</button>
      </div>
    </section>

    <section class="amgt-tab-pane amgt-hidden" data-pane="basemaps">
      <h3>Modifications des données</h3>
      <div class="amgt-settings-action">
        <button id="amgt-settings-edit-labels" class="amgt-btn amgt-btn--primary">✥ Mode édition</button>
        <p class="amgt-settings-hint">
          Affiche les couches « Plans d'ensemble » et « Numéros interstation » et
          active le mode édition des étiquettes (références de planche, numéros
          d'interstation) : survol = surbrillance, premier clic = sélection, second
          clic = modification. Le bouton « ✥ Mode édition » (en bas à droite)
          affiche l'aide et le suivi.
        </p>
      </div>

      <div class="amgt-settings-action">
        <button id="amgt-settings-load-shapefile" class="amgt-btn" disabled>Charger un nouveau shapefile…</button>
        <p class="amgt-settings-hint">À venir : remplacer les shapefiles de data/shapefile/ depuis l’application (nécessite l’enregistrement sur le serveur). Le chargement prendra <strong>un ou plusieurs fichiers du dossier</strong> du shapefile (.shp, .dbf, .shx, .prj, .cpg…), pas seulement le .shp.</p>
      </div>
    </section>
  </div>

  <!-- Recherche (station, tunnel, point métier) : remplace le contrôle de zoom
       Leaflet en haut à droite. Le zoom reste possible à la molette, au
       pincement et au double-clic. -->
  <div id="amgt-topright">
    <div id="amgt-search-box">
      <button id="amgt-search-toggle" class="amgt-btn amgt-btn--icon amgt-btn--tool" title="Rechercher une station, un tunnel ou un point" aria-label="Rechercher">
        <svg class="amgt-tool-icon" aria-hidden="true" focusable="false" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="22" /><circle cx="21" cy="21" r="8.5" /><line x1="21" y1="17" x2="21" y2="25" /><line x1="17" y1="21" x2="25" y2="21" /><line x1="27.5" y1="27.5" x2="35" y2="35" /></svg>
      </button>
      <div id="amgt-search-panel" class="amgt-hidden">
        <input type="text" id="amgt-search-input" placeholder="Station, tunnel, point..." autocomplete="off" />
        <ul id="amgt-search-results"></ul>
      </div>
    </div>
    <!-- Sous la loupe, pour tout le monde. -->
    <button id="amgt-measure-btn" class="amgt-btn amgt-btn--icon amgt-btn--tool" title="Mesurer un rayon : presser-glisser-relâcher" aria-label="Mesurer">
      <svg class="amgt-tool-icon" aria-hidden="true" focusable="false" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="22" /><g transform="translate(24 24) scale(.86) translate(-24 -24)"><g transform="rotate(-35 24 24)"><rect x="8" y="18" width="32" height="12" rx="1.5" /><line x1="13" y1="18" x2="13" y2="24" /><line x1="18" y1="18" x2="18" y2="21.5" /><line x1="23" y1="18" x2="23" y2="24" /><line x1="28" y1="18" x2="28" y2="21.5" /><line x1="33" y1="18" x2="33" y2="24" /></g></g></svg>
    </button>
    <!-- Sous la règle : sondage virtuel (src/virtualBoreTool.js) -->
    <button id="amgt-bore-btn" class="amgt-btn amgt-btn--icon amgt-btn--tool" title="Forage virtuel : nappe et sous-sol à un endroit (presser-glisser-relâcher)" aria-label="Forage virtuel">
      <svg class="amgt-tool-icon" aria-hidden="true" focusable="false" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="22" /><path d="M26.89 10.35C27.67 10.38 30.17 10.28 31.57 10.53C32.96 10.78 34.78 11.38 35.23 11.85C35.69 12.32 35.69 13.00 34.30 13.35C32.91 13.70 28.12 13.85 26.89 13.95" /><path d="M26.89 13.95C25.81 13.95 22.49 13.85 20.41 13.95C18.33 14.05 15.80 14.20 14.41 14.55C13.02 14.90 12.07 15.55 12.07 16.05C12.07 16.55 13.30 17.23 14.41 17.55C15.51 17.87 17.98 17.90 18.70 17.97" /><path d="M28.99 17.97C29.88 18.15 33.22 18.70 34.30 19.05C35.38 19.40 35.73 19.72 35.47 20.07C35.21 20.42 34.17 20.87 32.74 21.15C31.31 21.43 27.86 21.65 26.89 21.75" /><path d="M26.89 21.75C25.81 21.75 22.49 21.65 20.41 21.75C18.33 21.85 15.80 22.00 14.41 22.35C13.02 22.70 12.07 23.35 12.07 23.85C12.07 24.35 13.30 25.03 14.41 25.35C15.51 25.67 17.98 25.70 18.70 25.77" /><path d="M28.99 25.77C29.88 25.95 33.22 26.50 34.30 26.85C35.38 27.20 35.73 27.52 35.47 27.87C35.21 28.22 34.17 28.67 32.74 28.95C31.31 29.23 27.86 29.45 26.89 29.55" /><path d="M26.89 29.55C25.81 29.55 22.49 29.45 20.41 29.55C18.33 29.65 15.80 29.80 14.41 30.15C13.02 30.50 12.07 31.15 12.07 31.65C12.07 32.15 13.30 32.83 14.41 33.15C15.51 33.47 17.98 33.50 18.70 33.57" /><path d="M28.99 33.57C29.88 33.75 33.22 34.30 34.30 34.65C35.38 35.00 35.73 35.32 35.47 35.67C35.21 36.02 34.17 36.47 32.74 36.75C31.31 37.03 27.86 37.25 26.89 37.35" /><path d="M26.89 37.35C26.30 37.36 24.68 37.40 23.38 37.41C22.08 37.42 19.97 37.52 19.09 37.41C18.20 37.30 18.07 37.06 18.07 36.75C18.07 36.44 18.92 35.75 19.09 35.55" /><line x1="20.41" y1="10.53" x2="20.41" y2="13.95" /><line x1="20.41" y1="16.05" x2="20.41" y2="21.45" /><line x1="26.89" y1="16.05" x2="26.89" y2="21.45" /><line x1="20.41" y1="23.85" x2="20.41" y2="29.25" /><line x1="26.89" y1="23.85" x2="26.89" y2="29.25" /><line x1="20.41" y1="31.65" x2="20.41" y2="35.55" /><line x1="26.89" y1="31.65" x2="26.89" y2="35.55" /></svg>
    </button>
    <!-- Sous la règle : visible seulement le temps d'une mesure (measureTool.js, _hideDelayMs). -->
    <button id="amgt-screenshot-btn" class="amgt-btn amgt-btn--icon amgt-hidden" title="Enregistrer la capture de la mesure (image PNG)">
      💾
    </button>
  </div>

  <!-- Échec de chargement des données (ex. ouverture en file:// sans serveur HTTP) : message rempli par app.js -->
  <div id="amgt-load-error" class="amgt-banner amgt-hidden"></div>

  <!-- Navigation temporelle orthophotos (visible uniquement quand ce fond est actif) -->
  <div id="amgt-year-slider-bar" class="amgt-hidden">
    <button id="amgt-year-prev" class="amgt-chevron-btn" title="Année accessible précédente">‹</button>
    <button id="amgt-bruciel-year-label" type="button" disabled>&hellip;</button>
    <!-- Logo de l'entité dont l'orthophoto est affichée (voir mapMenu.js) -->
    <!-- Orientation de la prise de vue, quand l'année a plusieurs variantes (flèche ↕ nord-sud, ↔ est-ouest ; IR = infrarouge) -->
    <span id="amgt-orientation" class="amgt-hidden"></span>
    <img id="amgt-source-logo" class="amgt-hidden" width="22" height="22" alt="" />
    <button id="amgt-year-next" class="amgt-chevron-btn" title="Année accessible suivante">›</button>
    <button id="amgt-year-latest" class="amgt-chevron-btn" title="Revenir à l'année la plus récente accessible">⏭</button>
