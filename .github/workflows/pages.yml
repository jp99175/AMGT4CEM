# Publie le site (home.html et ses interfaces, dont ?app=dice) sur GitHub Pages.
# Réglage requis une fois : Settings > Pages > Source = « GitHub Actions ».
name: Pages

on:
  push:
    branches: [claude/amgt4cem-mapping-app-fy2zdt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
